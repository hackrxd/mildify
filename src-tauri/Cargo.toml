[package]
name = "mildify"
version = "1.2.0"
description = "A custom native Spotify client: Web API for browsing, librespot (Spotify Connect) for playback"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"

[lib]
name = "mildify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
# Interface-only updates (ui.rs); all four are already in the tree through Tauri and its updater plugin.
minisign-verify = "0.2"
flate2 = "1"
tar = "0.4"
semver = "1"
# Also in the tree through librespot-core; the DevTools endpoint (devtools.rs) speaks WebSocket with it.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# The AI DJ's downloads (dj/install.rs): sherpa-onnx ships .tar.bz2 (pure-Rust bzip2), llama.cpp ships
# Windows builds as .zip. zip is already in the tree through the updater, without deflate.
bzip2 = "0.6"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# The DJ's voice (dj/speaker.rs) plays natively, as the music does: already in the tree through librespot's
# rodio backend, with the same features.
rodio = { version = "0.21", default-features = false, features = ["playback"] }

# The DJ's cloud API keys (dj/secrets.rs) live in the system's keychain. On Linux, libdbus is built from source,
# so neither builds nor users need its development files.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

# librespot is pinned to a dev-branch commit: the 0.8.0 release predates the
# 2026 CDN fallback fix (#1722) that keeps playback working against current servers.
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061", features = ["rodio-backend"] }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }

# Upstream librespot-core exits the process on free accounts; see vendor/librespot-core/PATCHED.md.
[patch."https://github.com/librespot-org/librespot"]
librespot-core = { path = "vendor/librespot-core" }

[profile.release]
lto = "thin"
strip = true

# File and line numbers are enough for backtraces; full debug info made the debug binary ~500 MB and slow to link.
[profile.dev]
debug = "line-tables-only"
