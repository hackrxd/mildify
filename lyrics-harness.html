<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrics harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
      #stage {
        position: absolute; inset: 0 0 44px 0; overflow: hidden;
        --spice-sidebar: #000; --spice-text: #fff; --spice-button: #e8b04b;
        --spice-rgb-selected-row: 255, 255, 255; --background-tinted-base: rgb(255 255 255 / 0.07);
        --encore-graphic-size-decorative-base: 24px;
      }
      #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 8px; align-items: center; padding: 0 12px; background: #111; }
      #bar button { font: inherit; padding: 6px 12px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bar">
      <button id="toggle">Play / pause</button>
      <button id="nowbar">Toggle cover</button>
      <span>Dev harness for the Spicy Lyrics renderer port. Sample text, simulated clock.</span>
    </div>
    <script type="module" src="/src/dev/lyrics-harness.ts"></script>
  </body>
</html>
