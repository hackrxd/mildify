# Builds installers for Windows, macOS (Apple silicon and Intel) and Linux.
# Tauri can't cross-compile between operating systems, so each target builds on its own runner.
# Pushing a tag like v0.1.0 (matching the version in src-tauri/tauri.conf.json) builds a GitHub
# release with every installer attached, plus the signed update bundles and latest.json the in-app
# updater reads. The release stays a draft until all four builds succeed, then it's published as
# the latest release, so installed copies never see a latest.json that's missing a platform.
# The test job (Vitest, svelte-check, cargo test) has to pass too before a release is published.
# Pushes to main and pull requests only run the tests; installers are built for version tags, or
# for any branch when the workflow is started by hand.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      skip: ${{ steps.tagged.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # `git push origin main v1.2.3` starts a branch run and a tag run for the same commit. The tag
      # run tests and builds the release, so the branch run stands down instead of testing twice.
      - id: tagged
        if: github.ref_type == 'branch'
        run: |
          if git ls-remote --tags origin 'refs/tags/v*' | grep -q "^${GITHUB_SHA}"; then
            echo "::notice::${GITHUB_SHA} has a version tag; its tag run builds it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match version ${version} in src-tauri/tauri.conf.json"
            exit 1
          fi

      - id: release
        if: github.ref_type == 'tag'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Mildify ${context.ref.replace('refs/tags/', '')}`,
              generate_release_notes: true,
              draft: true,
            });
            return data.id;

  # Runs beside the builds rather than before them, so it doesn't slow a release down; a failure
  # still keeps the release a draft, since publish-release waits for it.
  test:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: test

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --lib --locked
        working-directory: src-tauri

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Restores the dependency cache rust-cache.yml keeps warm on main. A tag can't restore another
      # tag's caches, so saving one here would only take up the repo's cache quota.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.platform }}${{ matrix.args }}
          save-if: false

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}

      # Interface-only updates (src-tauri/src/ui.rs): the built UI, signed like the update bundles, and
      # ui.json, which names the backend it needs. Installed apps with that backend load it with a
      # reload, so their music keeps playing; the rest take the full update from latest.json.
      - name: Interface bundle
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(jq -r .version dist/build.json)
          bundle="ui-${version}.tar.gz"
          mkdir ui-bundle
          tar -czf "ui-bundle/${bundle}" -C dist .
          npx tauri signer sign --app-version "${version}" "ui-bundle/${bundle}"
          jq -n \
            --arg version "${version}" \
            --arg backend "$(jq -r .backend dist/build.json)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${bundle}" \
            --arg signature "$(cat "ui-bundle/${bundle}.sig")" \
            '{version: $version, backend: $backend, url: $url, signature: $signature}' > ui-bundle/ui.json

      - name: Attach the interface bundle
        if: startsWith(matrix.platform, 'ubuntu') && github.ref_type == 'tag'
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            for (const name of fs.readdirSync('ui-bundle')) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number(process.env.release_id),
                name,
                data: fs.readFileSync(`ui-bundle/${name}`),
              });
            }

      - uses: actions/upload-artifact@v4
        with:
          name: mildify-${{ matrix.platform }}${{ contains(matrix.args, 'aarch64') && '-arm64' || contains(matrix.args, 'x86_64') && '-x64' || '' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error

  publish-release:
    needs: [prepare, test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          release_id: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              draft: false,
              make_latest: 'true',
            });
